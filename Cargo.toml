[package]
name = "atlas-hfsplus"
version = "26.0.2-a"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read HFS+ and HFSX volumes: catalog and extents B-trees, hard links, decmpfs compression, extended attributes and journal replay."
repository = "https://github.com/05Narwhal/atlas-hfsplus"
documentation = "https://disk-atlas.julianloy.com/docs"
readme = "README.md"
keywords = ["hfsplus", "hfs", "filesystem", "macos", "parser"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[features]
# Test volume builders and byte-level fixtures, for crates that test against this one.
test-util = []

[dependencies]
atlas-fs-core = { version = "26.0.2-a", path = "../atlas-fs-core" }
# LZFSE and LZVN decmpfs chunks (LZVN is decoded as an LZFSE `bvxn` block).
lzfse_rust = "0.2"
# zlib decmpfs chunks.
miniz_oxide = "0.8"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
